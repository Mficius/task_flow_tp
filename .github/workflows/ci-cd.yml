name: Mon pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executer Node js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Version LTS stable recommandée

      - name: Installer les dependances
        run: npm ci

      # - name: Executer les tests
      #   run: npm test -- --coverage --watchAll=false

  build:
    runs-on: ubuntu-24.04
    needs: test-frontend # Optionnel: empêche le build si les tests échouent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Corrigé pour utiliser votre secret
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image frontend
        run: |
          docker build \
            -t ${{ env.DOCKER_USERNAME }}/taskFlow:${{ env.IMAGE_TAG }} .

      - name: Pusher l'image 
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/taskFlow:${{ env.IMAGE_TAG }}
